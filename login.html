<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to MealDesk">
    <title>Login | MealDesk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <style>
        body {
            background-color: var(--md-bg-base);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: var(--md-surface);
            border-radius: 1.5rem;
            box-shadow: var(--md-shadow-lg);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            border: 1px solid var(--md-border);
        }
        .auth-brand {
            font-family: var(--md-font-display);
            font-weight: 800;
            font-size: 1.75rem;
            color: var(--md-primary);
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; text-decoration: none;
            margin-bottom: 2rem;
        }
        .auth-brand i { color: var(--md-accent); }
        
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--md-border);
            background-color: transparent;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px var(--md-primary-light);
            border-color: var(--md-primary);
        }
        .input-group-text {
            border-radius: 0.75rem;
            background-color: transparent;
            border-color: var(--md-border);
            cursor: pointer;
        }
        
        .btn-social {
            border: 1px solid var(--md-border);
            background: var(--md-surface);
            color: var(--md-text-main);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.25rem;
            transition: all var(--md-transition-fast);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-social:hover { transform: translateY(-4px); box-shadow: var(--md-shadow-sm); border-color: transparent; color: #fff; }
        .btn-social.google:hover { background: #ea4335; }
        .btn-social.facebook:hover { background: #1877f2; }
        .btn-social.apple:hover { background: #000; }
        .divider {
            display: flex; align-items: center; text-align: center; margin: 1.5rem 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--md-border);
        }
        .divider span { padding: 0 1rem; color: var(--md-text-muted); font-size: 0.875rem; }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>

    <!-- Desktop Toggles (Fixed top right) -->
    <div class="position-absolute top-0 end-0 m-4 d-none d-lg-flex gap-2 z-index-1">
        <button class="md-icon-btn theme-toggle-btn bg-surface shadow-sm border" aria-label="Toggle Theme"><i class="bi bi-moon"></i></button>
        <button class="md-icon-btn rtl-toggle-btn bg-surface shadow-sm border" aria-label="Toggle RTL"><i class="bi bi-translate"></i></button>
    </div>

    <div style="width: 100%; max-width: 550px;">
        <!-- Mobile & Tab Toggles (Aligned outside right corner of card) -->
        <div class="d-flex d-lg-none justify-content-end gap-2 mb-3">
            <button class="md-icon-btn theme-toggle-btn bg-surface shadow-sm border" aria-label="Toggle Theme"><i class="bi bi-moon"></i></button>
            <button class="md-icon-btn rtl-toggle-btn bg-surface shadow-sm border" aria-label="Toggle RTL"><i class="bi bi-translate"></i></button>
        </div>

        <div class="auth-card reveal-scale">
        <a href="index.html" class="auth-brand">
            <i class="bi bi-box-seam"></i> MealDesk
        </a>
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">Welcome Back</h4>
            <p class="text-muted small">Enter your credentials to access your account.</p>
        </div>
        
        <form class="needs-validation" novalidate id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold">Work Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control border-end-0" id="password" placeholder="••••••••" required>
                    <span class="input-group-text border-start-0" id="togglePassword"><i class="bi bi-eye-slash text-muted"></i></span>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>
            </div>
            
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="forgot-password.html" class="small text-decoration-none fw-bold text-accent">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-3" style="background-color: var(--md-primary); border: none;">Sign In</button>
        </form>
        
        <div class="divider"><span>OR CONTINUE WITH</span></div>
        
        <div class="d-flex justify-content-center gap-3">
            <button class="btn-social google" title="Google"><i class="bi bi-google"></i></button>
            <button class="btn-social facebook" title="Facebook"><i class="bi bi-facebook"></i></button>
            <button class="btn-social apple" title="Apple"><i class="bi bi-apple"></i></button>
        </div>
        
        <p class="text-center mt-4 mb-0 small text-muted">
            Don't have an account? <a href="signup.html" class="fw-bold text-decoration-none">Sign Up</a>
        </p>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Password Visibility Toggle
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        });

        // Demo redirect on valid form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            if (this.checkValidity()) {
                e.preventDefault();
                // Redirect to dashboard
                window.location.href = 'dashboard/index.html';
            }
        });
    </script>
</body>
</html>
