<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset Password for MealDesk">
    <title>Forgot Password | MealDesk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <style>
        body {
            background-color: var(--md-bg-base);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: var(--md-surface);
            border-radius: 1.5rem;
            box-shadow: var(--md-shadow-lg);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            border: 1px solid var(--md-border);
        }
        .auth-brand {
            font-family: var(--md-font-display);
            font-weight: 800;
            font-size: 1.75rem;
            color: var(--md-primary);
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; text-decoration: none;
            margin-bottom: 2rem;
        }
        .auth-brand i { color: var(--md-accent); }
        
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--md-border);
            background-color: transparent;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px var(--md-primary-light);
            border-color: var(--md-primary);
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>

    <button class="md-icon-btn theme-toggle-btn position-absolute top-0 end-0 m-4 bg-surface shadow-sm"><i class="bi bi-moon"></i></button>

    <div class="auth-card reveal-scale">
        <a href="index.html" class="auth-brand"><i class="bi bi-box-seam"></i> MealDesk</a>
        
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">Reset Password</h4>
            <p class="text-muted small">Enter your work email and we'll send you a link to reset your password.</p>
        </div>
        
        <form class="needs-validation" novalidate id="resetForm">
            <div class="mb-4">
                <label for="email" class="form-label small fw-bold">Work Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-4" style="background-color: var(--md-primary); border: none;">Send Reset Link</button>
        </form>
        
        <div class="text-center">
            <a href="login.html" class="text-muted small text-decoration-none fw-bold"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            if (this.checkValidity()) {
                e.preventDefault();
                alert('If an account exists for this email, a reset link has been sent.');
                window.location.href = 'login.html';
            } else {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
